server.port=8080
spring.config.import=optional:file:.env[.properties]
# --- Gemini API (Gemma 4 is served through this API) ---
# Set the key as an environment variable: GEMINI_API_KEY=AIza...
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.default-model=${GEMINI_MODEL:gemma-4-26b-a4b-it}
# Only these models can be requested by the frontend
gemini.allowed-models=gemma-4-26b-a4b-it,gemma-4-31b-it

# Allowed browser origins (Vite dev server)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Screenshot upload limits
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB


logging.level.com.errorlens=DEBUG